[package]
name = "pipefog"
version = "0.1.0"
edition = "2021"
description = "Stream-structured data obfuscator for JSON/YAML."
license = "MIT"
repository = "https://github.com/renatgalimov/pipefog"
homepage = "https://github.com/renatgalimov/pipefog"
documentation = "https://docs.rs/pipefog"

[dependencies]
sha3 = "0.10.*"
serde_json = "1.*"
regex = "*"
lazy_static = "1.*"
hex = "0.4"
chrono = "0.4"
rand = "0.8"
data-encoding = "2.*"

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
