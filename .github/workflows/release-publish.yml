name: Publish to crates.io

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.toml version to tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag_version = os.environ["TAG_VERSION"]
          cargo_toml = Path("Cargo.toml")
          contents = cargo_toml.read_text(encoding="utf-8")
          updated = re.sub(
              r'(?m)^version\\s*=\\s*"[0-9]+\\.[0-9]+\\.[0-9]+"\\s*$',
              f'version = "{tag_version}"',
              contents,
              count=1,
          )
          if contents == updated:
            raise SystemExit("Cargo.toml version not updated; tag version may be invalid.")
          cargo_toml.write_text(updated, encoding="utf-8")
          PY
        env:
          TAG_VERSION: ${{ github.ref_name }}

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
