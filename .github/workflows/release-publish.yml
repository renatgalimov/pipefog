name: Publish to crates.io

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.toml version to tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          export TAG_VERSION="$tag_version"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag_version = os.environ["TAG_VERSION"]
          cargo_toml = Path("Cargo.toml")
          contents = cargo_toml.read_text(encoding="utf-8")
          version_match = re.search(r'(?m)^version\\s*=\\s*"([0-9]+\\.[0-9]+\\.[0-9]+)"\\s*$', contents)
          if not version_match:
            raise SystemExit("Cargo.toml version not found.")
          if version_match.group(1) == tag_version:
            print("Cargo.toml version already matches tag.")
            raise SystemExit(0)
          updated = re.sub(
              r'(?m)^version\\s*=\\s*"[0-9]+\\.[0-9]+\\.[0-9]+"\\s*$',
              f'version = "{tag_version}"',
              contents,
              count=1,
          )
          cargo_toml.write_text(updated, encoding="utf-8")
          PY

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
